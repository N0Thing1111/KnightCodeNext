<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KnightCode System Communication Map</title>
  <style>
    :root { --background:#061127; --foreground:#f5f8ff; --card:#0d1d3a; --card-foreground:#f5f8ff; --muted:#132747; --muted-foreground:#a9bcdd; --primary:#278cff; --primary-foreground:#fff; --border:#27466f; }
    body { margin:0; padding:24px; background:var(--background); color:var(--foreground); font:15px/1.5 Inter,Segoe UI,sans-serif; }
    main { max-width:1200px; margin:auto; }
    button,select { font:inherit; }
    .btn { border:1px solid var(--border); border-radius:8px; padding:9px 12px; background:var(--card); color:var(--foreground); }
    .btn-primary { background:var(--primary); color:var(--primary-foreground); }
    .form-label { color:var(--muted-foreground); }
    .form-select { width:100%; padding:9px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--foreground); }
    .card { padding:16px; border:1px solid var(--border); border-radius:12px; background:var(--card); }
    .text-muted { color:var(--muted-foreground); }
    code { color:#8ec5ff; }
  </style>
</head><body><main>
<div id="kc-system-map">
  <style>
    #kc-system-map { color: var(--foreground); display: grid; gap: 18px; }
    #kc-system-map * { box-sizing: border-box; }
    #kc-system-map .kc-head { display: grid; gap: 6px; }
    #kc-system-map .kc-head p { color: var(--muted-foreground); margin: 0; }
    #kc-system-map .kc-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
    #kc-system-map .kc-section { display: grid; gap: 14px; }
    #kc-system-map .kc-flow { display: grid; grid-template-columns: repeat(5, minmax(120px, 1fr)); gap: 12px; align-items: stretch; }
    #kc-system-map .kc-stage { display: grid; gap: 8px; align-content: start; min-width: 0; }
    #kc-system-map .kc-stage h3 { margin: 0; }
    #kc-system-map .kc-node { border: 1px solid var(--border); background: color-mix(in srgb, var(--card) 86%, transparent); color: var(--card-foreground); border-radius: 10px; padding: 10px; display: grid; gap: 3px; text-align: left; min-height: 62px; }
    #kc-system-map button.kc-node { width: 100%; }
    #kc-system-map .kc-node strong { font-weight: 500; }
    #kc-system-map .kc-node span { color: var(--muted-foreground); }
    #kc-system-map .kc-arrow { color: var(--muted-foreground); text-align: center; }
    #kc-system-map .kc-picker { display: grid; grid-template-columns: minmax(180px, .75fr) minmax(220px, 1.25fr); gap: 12px; align-items: end; }
    #kc-system-map .kc-picker label { display: grid; gap: 6px; }
    #kc-system-map .kc-detail { display: grid; gap: 12px; }
    #kc-system-map .kc-detail h3, #kc-system-map .kc-detail p { margin: 0; overflow-wrap: anywhere; }
    #kc-system-map .kc-detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    #kc-system-map .kc-detail-grid section { min-width: 0; }
    #kc-system-map .kc-detail-grid h3 { margin-bottom: 6px; }
    #kc-system-map .kc-list { margin: 0; padding-left: 19px; overflow-wrap: anywhere; }
    #kc-system-map .kc-empty { color: var(--muted-foreground); }
    #kc-system-map .kc-db { display: grid; gap: 8px; }
    #kc-system-map .kc-db-row { display: grid; grid-template-columns: minmax(180px, .45fr) minmax(260px, 1.55fr); gap: 12px; padding-block: 8px; border-bottom: 1px solid var(--border); }
    #kc-system-map .kc-db-row span { color: var(--muted-foreground); overflow-wrap: anywhere; }
    #kc-system-map [hidden] { display: none !important; }
    @media (max-width: 760px) {
      #kc-system-map .kc-flow { grid-template-columns: 1fr; }
      #kc-system-map .kc-arrow { transform: rotate(90deg); }
      #kc-system-map .kc-picker, #kc-system-map .kc-detail-grid, #kc-system-map .kc-db-row { grid-template-columns: 1fr; }
    }
  </style>
  <header class="kc-head">
    <h1>How KnightCode files communicate</h1>
    <p>Choose a flow for the simple picture, or choose any source file to see what it calls and what calls it.</p>
  </header>
  <div class="kc-tabs" role="tablist" aria-label="Map view">
    <button class="btn btn-primary" type="button" data-view="overview" aria-pressed="true">Simple system map</button>
    <button class="btn" type="button" data-view="files" aria-pressed="false">Every source file</button>
    <button class="btn" type="button" data-view="database" aria-pressed="false">Database connections</button>
  </div>

  <section class="kc-section" data-panel="overview">
    <div class="viz-controls">
      <label class="form-label">Follow one task
        <select class="form-select" id="kc-flow-choice">
          <option value="student">Student opens a lesson</option>
          <option value="game">Unity saves an attempt</option>
          <option value="teacher">Teacher creates an assignment</option>
          <option value="admin">Admin changes school data</option>
          <option value="login">A user signs in</option>
        </select>
      </label>
    </div>
    <div class="kc-flow" id="kc-flow" aria-live="polite"></div>
    <div class="card" id="kc-flow-note"></div>
  </section>

  <section class="kc-section" data-panel="files" hidden>
    <div class="kc-picker">
      <label class="form-label">Part of the system
        <select class="form-select" id="kc-category"></select>
      </label>
      <label class="form-label">Source file
        <select class="form-select" id="kc-file"></select>
      </label>
    </div>
    <article class="card kc-detail" id="kc-file-detail" aria-live="polite"></article>
  </section>

  <section class="kc-section" data-panel="database" hidden>
    <p class="text-muted">Each row shows the project files that directly name that table. Database security rules and triggers live in the migration files.</p>

  </section>

    const root = document.getElementById('kc-system-map');
    const flows = {
      student: {
        steps: [
          ['Browser page', 'src/app/(student)/lesson/[id]/page.tsx'],
          ['Login check', 'src/lib/auth.ts'],
          ['Read helper', 'src/lib/student-data.ts'],
          ['Supabase client', 'src/lib/supabase/server.ts'],
          ['PostgreSQL tables', 'assignments → lessons → levels → progress']
        ],
        note: 'The page asks requireStudent who is signed in. Then student-data reads only rows allowed by Supabase Row Level Security and returns plain data for React to display.'
      },
      game: {
        steps: [
          ['Unity WebGL', 'public/game_build + game code'],
          ['Browser bridge', 'public/assets/js/performance-bridge.js'],
          ['Protected API', 'src/app/api/progress/route.ts'],
          ['Database function', 'record_level_progress'],
          ['Progress records', 'sessions + lifetime progress + activity + XP']
        ],
        note: 'Unity never writes directly to the database. The bridge sends JSON to /api/progress. The API checks the login and values. PostgreSQL then saves the attempt as one safe transaction.'
      },
      teacher: {
        steps: [
          ['Teacher form', 'src/app/(teacher)/teacher/assignments/assignment-form.tsx'],
          ['Server action', 'src/app/actions/teacher.ts'],
          ['Permission check', 'requireTeacher + ownership checks'],
          ['Trusted Supabase client', 'src/lib/supabase/admin.ts'],
          ['Assignment records', 'assignments + student_notifications']
        ],
        note: 'The form calls a server action. That action validates the fields, confirms the teacher owns the class or student, writes the assignment, and asks Next.js to refresh affected pages.'
      },
      admin: {
        steps: [
          ['Admin page', 'src/app/(admin)/admin/manage/[entity]/page.tsx'],
          ['Server action', 'src/app/actions/admin.ts'],
          ['Admin role check', 'requireAdmin'],
          ['Service client', 'src/lib/supabase/admin.ts'],
          ['School data + audit', 'selected table + admin_audit_log']
        ],
        note: 'Admin pages submit to server actions. The action checks the admin role, changes the selected record with the secret server-only client, and records what happened in the audit log.'
      },
      login: {
        steps: [
          ['Login form', '/login, /teacher-login, or /admin-login'],
          ['Auth handler', 'server action or /api/*/login'],
          ['Supabase Auth', 'auth.users verifies the password'],
          ['Profile lookup', 'profiles supplies the KnightCode role'],
          ['Session cookie', 'proxy refreshes it; layouts enforce the role']
        ],
        note: 'Supabase Auth owns passwords. KnightCode profiles store the school role and display information. The browser keeps a secure session cookie, and protected layouts redirect the wrong role.'
      }
    };

    const escapeHtml = (value) => String(value).replace(/[&<>"]/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]));
    const list = (items) => items.length ? '<ul class="kc-list">' + items.map((item) => '<li><code>' + escapeHtml(item) + '</code></li>').join('') + '</ul>' : '<span class="kc-empty">None in this file</span>';

    function renderFlow(name) {
      const flow = flows[name];
      root.querySelector('#kc-flow').innerHTML = flow.steps.map((step, index) =>
        '<div class="kc-stage"><h3>Step ' + (index + 1) + '</h3><div class="kc-node"><strong>' + escapeHtml(step[0]) + '</strong><span>' + escapeHtml(step[1]) + '</span></div>' + (index < flow.steps.length - 1 ? '<div class="kc-arrow" aria-hidden="true">→</div>' : '') + '</div>'
      ).join('');
      root.querySelector('#kc-flow-note').textContent = flow.note;
    }

    const category = root.querySelector('#kc-category');
    const fileSelect = root.querySelector('#kc-file');
    const categories = ['All files', ...new Set(DATA.records.map((record) => record.category))];
    category.innerHTML = categories.map((value) => '<option>' + escapeHtml(value) + '</option>').join('');

    function fillFiles() {
      const filtered = category.value === 'All files' ? DATA.records : DATA.records.filter((record) => record.category === category.value);
      fileSelect.innerHTML = filtered.map((record) => '<option value="' + escapeHtml(record.file) + '">' + escapeHtml(record.file) + '</option>').join('');
      renderFile();
    }

    function renderFile() {
      const record = DATA.records.find((item) => item.file === fileSelect.value) || DATA.records[0];
      const endpoint = record.route ? '<p><strong>URL:</strong> <code>' + escapeHtml(record.route) + '</code></p>' : '';
      root.querySelector('#kc-file-detail').innerHTML =
        '<p class="text-muted">' + escapeHtml(record.category) + '</p>' +
        '<h2><code>' + escapeHtml(record.file) + '</code></h2>' +
        '<p>' + escapeHtml(record.description) + '</p>' + endpoint +
        '<div class="kc-detail-grid">' +
          '<section><h3>Imports and calls these project files</h3>' + list(record.imports) + '</section>' +
          '<section><h3>Imported by these project files</h3>' + list(record.usedBy) + '</section>' +
          '<section><h3>Database tables</h3>' + list(record.tables) + '</section>' +
          '<section><h3>Database functions</h3>' + list(record.rpcs) + '</section>' +
          '<section><h3>API addresses it sends to</h3>' + list(record.urls) + '</section>' +
          '<section><h3>Functions or types it gives to other files</h3>' + list(record.exports) + '</section>' +
          '<section><h3>Third-party packages</h3>' + list(record.packages) + '</section>' +
          '<section><h3>Storage buckets or dynamic data sources</h3>' + list(record.buckets) + '</section>' +
        '</div>';
    }

    root.querySelector('#kc-db').innerHTML = DATA.database.map((item) =>
      '<div class="kc-db-row"><code>' + escapeHtml(item.table) + '</code><span>' + (item.files.length ? item.files.map(escapeHtml).join(' · ') : 'Used inside database functions or through a dynamic table name.') + '</span></div>'
    ).join('');

    root.querySelectorAll('[data-view]').forEach((button) => button.addEventListener('click', () => {
      root.querySelectorAll('[data-view]').forEach((item) => {
        const active = item === button;
        item.classList.toggle('btn-primary', active);
        item.setAttribute('aria-pressed', String(active));
      });
      root.querySelectorAll('[data-panel]').forEach((panel) => panel.hidden = panel.dataset.panel !== button.dataset.view);
    }));
    root.querySelector('#kc-flow-choice').addEventListener('change', (event) => renderFlow(event.target.value));
    category.addEventListener('change', fillFiles);
    fileSelect.addEventListener('change', renderFile);
    renderFlow('student');
    fillFiles();
  })();
  </script>
